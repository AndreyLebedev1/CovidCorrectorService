[project]
name = "covidcorrectorservice"
version = "0.1.0"
description = "FastAPI inference service for ResNet50 with a COVID-19 corrector"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "pillow>=10,<13",
    "scikit-learn>=1.3,<2",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
